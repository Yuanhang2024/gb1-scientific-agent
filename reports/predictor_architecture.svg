<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 860" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="pa" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0L6,2.5L0,5Z" fill="#4A5568"/></marker>
    <marker id="pg" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0L6,2.5L0,5Z" fill="#2D7D46"/></marker>
    <marker id="po" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0L6,2.5L0,5Z" fill="#C56A1B"/></marker>
    <marker id="pr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0L6,2.5L0,5Z" fill="#DC2626"/></marker>
  </defs>
  <rect width="1150" height="860" fill="#ffffff"/>
  <text x="575" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1a202c">适应度预测器：选型与服役两阶段分离</text>
  <text x="575" y="56" text-anchor="middle" font-size="11" fill="#718096">阶段 A 一次性冻结"用什么模型" · 阶段 B 每轮重训"怎么用它"</text>
  <rect x="170" y="80" width="860" height="60" rx="3" fill="#F5F8FF" stroke="#4A6FA5" stroke-width="0.8"/>
  <text x="600" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#3B5880">共享输入：4 位点变体（39/40/41/54，野生型 VDGV）→ one-hot 80 维（4×20）</text>
  <text x="600" y="126" text-anchor="middle" font-size="10.5" fill="#2d3748">fitness 不做对数变换 · 0 分记录保留 · 编码实现 gb1/data.py · one_hot</text>
  <line x1="430" y1="140" x2="430" y2="168" stroke="#4A5568" stroke-width="1" marker-end="url(#pa)"/>
  <line x1="770" y1="140" x2="770" y2="168" stroke="#4A5568" stroke-width="1" marker-end="url(#pa)"/>
  <rect x="60" y="172" width="520" height="460" rx="4" fill="#F4FCF4" stroke="#2D7D46" stroke-width="1"/>
  <rect x="60" y="172" width="520" height="26" rx="4" fill="#2D7D46"/>
  <rect x="60" y="186" width="520" height="12" fill="#F4FCF4"/>
  <rect x="60" y="172" width="520" height="26" rx="4" fill="none" stroke="#2D7D46" stroke-width="1"/>
  <text x="320" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">阶段 A · 选型（一次性 · 实验开始时）</text>
  <rect x="80" y="208" width="480" height="52" rx="2" fill="#fff" stroke="#2D7D46" stroke-width="0.5"/>
  <text x="320" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#1B5E20">数据划分（同一划分供全部配置）</text>
  <text x="320" y="246" text-anchor="middle" font-size="10" fill="#2d3748">训练 2,000 · 验证 1,000 —— 验证集与训练/候选零重叠（代码强制）</text>
  <line x1="320" y1="260" x2="320" y2="268" stroke="#4A5568" stroke-width="0.8" marker-end="url(#pa)"/>
  <rect x="80" y="270" width="480" height="72" rx="2" fill="#fff" stroke="#2D7D46" stroke-width="0.5"/>
  <text x="320" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#1B5E20">七种配置 · 同训同验（scikit-learn）</text>
  <rect x="92" y="300" width="146" height="34" rx="2" fill="#F4FCF4" stroke="#2D7D46" stroke-width="0.3"/>
  <text x="165" y="314" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1B5E20">Ridge × 3</text>
  <text x="165" y="328" text-anchor="middle" font-size="9" fill="#2d3748">α = 0.1 / 1.0 / 10.0</text>
  <rect x="247" y="300" width="146" height="34" rx="2" fill="#F4FCF4" stroke="#2D7D46" stroke-width="0.3"/>
  <text x="320" y="314" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1B5E20">Random Forest × 2</text>
  <text x="320" y="328" text-anchor="middle" font-size="9" fill="#2d3748">100 树 · leaf = 1/3</text>
  <rect x="402" y="300" width="146" height="34" rx="2" fill="#F4FCF4" stroke="#2D7D46" stroke-width="0.3"/>
  <text x="475" y="314" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1B5E20">Extra Trees × 2</text>
  <text x="475" y="328" text-anchor="middle" font-size="9" fill="#2d3748">100 树 · leaf = 1/3</text>
  <line x1="320" y1="342" x2="320" y2="350" stroke="#4A5568" stroke-width="0.8" marker-end="url(#pa)"/>
  <rect x="80" y="352" width="480" height="60" rx="2" fill="#fff" stroke="#2D7D46" stroke-width="0.5"/>
  <text x="320" y="372" text-anchor="middle" font-size="11" font-weight="600" fill="#1B5E20">指标与四级选择规则（确定性 tie-break）</text>
  <text x="320" y="388" text-anchor="middle" font-size="10" fill="#2d3748">验证 Spearman → Top-10 命中率 → 更低 MSE → 声明顺序</text>
  <text x="320" y="404" text-anchor="middle" font-size="9.5" font-weight="600" fill="#DC2626">候选池与最终测试（5,000）标签不参与选优</text>
  <line x1="320" y1="412" x2="320" y2="420" stroke="#4A5568" stroke-width="0.8" marker-end="url(#pa)"/>
  <rect x="80" y="422" width="480" height="50" rx="2" fill="#fff" stroke="#2D7D46" stroke-width="1"/>
  <text x="320" y="442" text-anchor="middle" font-size="11" font-weight="600" fill="#1B5E20">胜出：Random Forest</text>
  <text x="320" y="460" text-anchor="middle" font-size="10" fill="#2d3748">3 个种子一致选择 · 验证 Spearman ≈ 0.54</text>
  <line x1="320" y1="472" x2="320" y2="480" stroke="#4A5568" stroke-width="0.8" marker-end="url(#pa)"/>
  <rect x="80" y="482" width="480" height="50" rx="2" fill="#fff" stroke="#2D7D46" stroke-width="0.8"/>
  <text x="320" y="502" text-anchor="middle" font-size="11" font-weight="600" fill="#1B5E20">冻结输出：selection.json + initial_model.joblib</text>
  <text x="320" y="520" text-anchor="middle" font-size="10" fill="#2d3748">已冻结目录不覆盖 · 配置/数据清单不符即拒绝续跑</text>
  <rect x="620" y="172" width="520" height="460" rx="4" fill="#FFF8F0" stroke="#C56A1B" stroke-width="1"/>
  <rect x="620" y="172" width="520" height="26" rx="4" fill="#C56A1B"/>
  <rect x="620" y="186" width="520" height="12" fill="#FFF8F0"/>
  <rect x="620" y="172" width="520" height="26" rx="4" fill="none" stroke="#C56A1B" stroke-width="1"/>
  <text x="880" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">阶段 B · 服役（每轮 · 实验进行中）</text>
  <rect x="640" y="208" width="480" height="52" rx="2" fill="#fff" stroke="#C56A1B" stroke-width="0.5"/>
  <text x="880" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#8B4513">每轮输入：累计已知数据</text>
  <text x="880" y="246" text-anchor="middle" font-size="10" fill="#2d3748">初始训练集 + 历史轮次反馈回填 · load_selection 校验清单一致</text>
  <line x1="880" y1="260" x2="880" y2="268" stroke="#4A5568" stroke-width="0.8" marker-end="url(#pa)"/>
  <rect x="640" y="270" width="480" height="50" rx="2" fill="#fff" stroke="#C56A1B" stroke-width="0.8"/>
  <text x="880" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#8B4513">重训胜者家族（fit_model）</text>
  <text x="880" y="308" text-anchor="middle" font-size="10" fill="#2d3748">沿用冻结 spec（家族 + 超参）· 每轮全新拟合，不增量更新</text>
  <line x1="880" y1="320" x2="880" y2="328" stroke="#4A5568" stroke-width="0.8" marker-end="url(#pa)"/>
  <rect x="640" y="330" width="480" height="50" rx="2" fill="#fff" stroke="#C56A1B" stroke-width="0.5"/>
  <text x="880" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#8B4513">Agent ④ Fitness Evaluator 调用</text>
  <text x="880" y="368" text-anchor="middle" font-size="10" fill="#2d3748">对本轮 ≤40 个候选逐一预测 fitness（纯代码，无 LLM 参与）</text>
  <line x1="880" y1="380" x2="880" y2="388" stroke="#4A5568" stroke-width="0.8" marker-end="url(#pa)"/>
  <rect x="640" y="390" width="480" height="50" rx="2" fill="#fff" stroke="#C56A1B" stroke-width="0.5"/>
  <text x="880" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#8B4513">输出：预测分 → Top-k 选择</text>
  <text x="880" y="428" text-anchor="middle" font-size="10" fill="#2d3748">排序候选供 Critic 审查 · 推荐后取真实 fitness 回填</text>
  <path d="M 1128,415 H 1146 V 234 H 1124" fill="none" stroke="#C56A1B" stroke-width="0.8" stroke-dasharray="6,4" marker-end="url(#po)"/>
  <text x="1158" y="325" text-anchor="middle" font-size="10" fill="#C56A1B" font-style="italic" transform="rotate(-90 1158 325)">真实 fitness 回填 → 下一轮累计数据</text>
  <path d="M 580,507 H 600 V 295 H 636" fill="none" stroke="#2D7D46" stroke-width="1" stroke-dasharray="6,4" marker-end="url(#pg)"/>
  <rect x="578" y="368" width="72" height="36" rx="2" fill="#fff" stroke="#2D7D46" stroke-width="0.4"/>
  <text x="614" y="384" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1B5E20">冻结的胜者 spec</text>
  <text x="614" y="396" text-anchor="middle" font-size="8.5" fill="#2d3748">（家族 + 超参，一次性）</text>
  <rect x="60" y="652" width="260" height="72" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="0.6"/>
  <text x="190" y="674" text-anchor="middle" font-size="11" font-weight="600" fill="#B91C1C">防泄漏约束</text>
  <text x="190" y="692" text-anchor="middle" font-size="10" fill="#2d3748">选型只见训练/验证集；</text>
  <text x="190" y="707" text-anchor="middle" font-size="10" fill="#2d3748">候选池与最终测试标签在</text>
  <text x="190" y="722" text-anchor="middle" font-size="10" fill="#2d3748">全部选优之后才允许使用</text>
  <rect x="340" y="652" width="750" height="72" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.4"/>
  <text x="715" y="674" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3748">两阶段分离的意义</text>
  <text x="715" y="692" text-anchor="middle" font-size="10" fill="#4A5568">选型仅发生一次并冻结，服役每轮只做"同 spec 重训 + 打分"</text>
  <text x="715" y="707" text-anchor="middle" font-size="10" fill="#4A5568">模型选择不被后续反馈污染，实验结果可复现</text>
  <text x="715" y="722" text-anchor="middle" font-size="9" fill="#A0AEC0" font-style="italic">gb1/models.py · select_model / load_selection / fit_model · model_comparison.csv</text>
</svg>
